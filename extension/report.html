<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Report issue · Handpick</title>
  <link rel="stylesheet" href="report.css">
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Report issue</h1>
        <p>Review the selected HTML and conversion output before sharing a report.</p>
      </div>
      <div class="actions">
        <button id="downloadButton" class="primary" type="button">Download debug case</button>
        <button id="githubButton" type="button">Open GitHub issue</button>
      </div>
    </header>

    <aside>
      Selected HTML may contain sensitive information. Review it before sharing, and remove anything private if needed.
    </aside>

    <section>
      <label for="description">What happened?</label>
      <textarea id="description" placeholder="Describe what looked wrong and what you expected instead."></textarea>
    </section>

    <div class="grid">
      <section>
        <label for="htmlInput">Selected HTML</label>
        <textarea id="htmlInput"></textarea>
      </section>
      <section>
        <label for="markdownOutput">Actual Markdown</label>
        <textarea id="markdownOutput"></textarea>
      </section>
      <section>
        <label for="plainTextOutput">Actual plain text</label>
        <textarea id="plainTextOutput"></textarea>
      </section>
    </div>

    <section class="previewSection">
      <label for="renderedPreview">Rendered preview</label>
      <div id="renderedPreview" class="renderedPreview"></div>
    </section>

    <div id="status" class="status" role="status"></div>
  </main>
  <script src="report.js"></script>
</body>
</html>
