<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Handpick Fixtures</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --text: #1f2937;
      --muted: #667085;
      --line: #d7dce3;
      --ok: #15803d;
      --bad: #b42318;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
    }
    main {
      width: min(1200px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 24px 0 32px;
    }
    h1 { margin: 0 0 6px; font-size: 26px; }
    p { margin: 0 0 18px; color: var(--muted); }
    .case {
      margin-bottom: 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      overflow: hidden;
    }
    .case-header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      font-weight: 700;
    }
    .pass { color: var(--ok); }
    .fail { color: var(--bad); }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }
    section {
      min-width: 0;
      padding: 14px 16px;
    }
    section + section {
      border-left: 1px solid var(--line);
    }
    h2 {
      margin: 0 0 8px;
      font-size: 14px;
    }
    pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    @media (max-width: 820px) {
      .grid { grid-template-columns: 1fr; }
      section + section {
        border-left: 0;
        border-top: 1px solid var(--line);
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Handpick Fixtures</h1>
    <p>저장된 케이스의 현재 출력과 기대 출력을 비교합니다.</p>
    <div id="cases"></div>
  </main>

  <script src="shared/turndown.js"></script>
  <script src="shared/converter-core.js"></script>
  <script>
    const cases = document.querySelector("#cases");

    async function readText(path) {
      const response = await fetch(path);
      return response.text();
    }

    async function renderFixtures() {
      const fixtures = await fetch("fixtures/index.json").then((response) => response.json());

      for (const fixture of fixtures) {
        const [input, expected] = await Promise.all([
          readText(`fixtures/${fixture.input}`),
          readText(`fixtures/${fixture.expected}`)
        ]);
        const doc = new DOMParser().parseFromString(input, "text/html");
        const content = window.Handpick.extractContent(doc);
        const actual = window.Handpick.convertToMarkdown(content, {
          outputFormat: fixture.outputFormat || "standard"
        });
        const passed = actual === expected.trim();

        const article = document.createElement("article");
        article.className = "case";
        article.innerHTML = `
          <div class="case-header">
            <span>${fixture.name}</span>
            <span class="${passed ? "pass" : "fail"}">${passed ? "PASS" : "FAIL"}</span>
          </div>
          <div class="grid">
            <section>
              <h2>Expected</h2>
              <pre></pre>
            </section>
            <section>
              <h2>Actual</h2>
              <pre></pre>
            </section>
          </div>
        `;
        article.querySelectorAll("pre")[0].textContent = expected.trim();
        article.querySelectorAll("pre")[1].textContent = actual;
        cases.append(article);
      }
    }

    renderFixtures();
  </script>
</body>
</html>
