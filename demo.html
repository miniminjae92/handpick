<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Handpick 웹 변환기</title>
  <meta name="description" content="HTML을 붙여넣으면 브라우저 안에서 Markdown으로 변환하는 Handpick의 웹 도구입니다.">
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --text: #1f2937;
      --muted: #667085;
      --line: #d7dce3;
      --accent: #0f766e;
      --accent-strong: #115e59;
      --code: #eef2f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
    }

    main {
      width: min(1180px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 28px 0;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 28px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }

    button {
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 8px;
      transition: border-color 150ms ease;
      background: var(--panel);
      color: var(--text);
      padding: 0 14px;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }

    button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #ffffff;
    }

    button:hover {
      border-color: var(--accent-strong);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    section {
      min-width: 0;
    }

    label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .hint {
      font-size: 13px;
      color: var(--muted);
      font-weight: 500;
    }

    textarea {
      width: 100%;
      min-height: 68vh;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      padding: 14px;
      font: 14px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      tab-size: 2;
    }

    textarea:focus {
      outline: 3px solid rgba(15, 118, 110, 0.18);
      border-color: var(--accent);
    }

    .status {
      min-height: 22px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 14px;
    }

    code {
      border-radius: 5px;
      background: var(--code);
      padding: 2px 5px;
      color: #344054;
      font-size: 0.95em;
    }

    @media (max-width: 820px) {
      header {
        align-items: stretch;
        flex-direction: column;
      }

      .actions {
        justify-content: stretch;
      }

      button {
        flex: 1 1 150px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      textarea {
        min-height: 46vh;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Handpick 웹 변환기</h1>
        <p>F12에서 Copy element 한 HTML을 붙여넣으면 본문을 골라 Markdown으로 바꿉니다.</p>
      </div>
      <div class="actions">
        <button id="convertButton" class="primary" type="button">변환</button>
        <button id="copyButton" type="button">복사</button>
        <button id="downloadButton" type="button">MD 저장</button>
        <button id="clearButton" type="button">비우기</button>
      </div>
    </header>

    <div class="grid">
      <section>
        <label for="htmlInput">
          HTML 입력
          <span class="hint">본문 후보를 자동 추출하고 잡음을 정리합니다</span>
        </label>
        <textarea id="htmlInput" spellcheck="false" placeholder="Copy element 한 HTML을 여기에 붙여넣으세요."></textarea>
      </section>

      <section>
        <label for="markdownOutput">
          Markdown 출력
          <span class="hint">그대로 README.md 등에 붙여넣기</span>
        </label>
        <textarea id="markdownOutput" spellcheck="false" placeholder="변환 결과가 여기에 표시됩니다."></textarea>
      </section>
    </div>

    <div id="status" class="status" role="status"></div>
  </main>

  <script src="shared/turndown.js"></script>
  <script src="shared/converter-core.js"></script>
  <script>
    const htmlInput = document.querySelector("#htmlInput");
    const markdownOutput = document.querySelector("#markdownOutput");
    const statusLine = document.querySelector("#status");

    function convert() {
      const html = htmlInput.value.trim();
      if (!html) {
        markdownOutput.value = "";
        statusLine.textContent = "HTML을 먼저 붙여넣어 주세요.";
        return;
      }

      const doc = new DOMParser().parseFromString(html, "text/html");
      const content = window.Handpick.extractContent(doc);
      markdownOutput.value = window.Handpick.convertToMarkdown(content);
      statusLine.textContent = `${window.Handpick.sourceLabel(content)} 기준으로 변환했습니다.`;
    }

    async function copyMarkdown() {
      if (!markdownOutput.value.trim()) convert();
      if (!markdownOutput.value.trim()) return;
      await navigator.clipboard.writeText(markdownOutput.value);
      statusLine.textContent = "Markdown을 클립보드에 복사했습니다.";
    }

    function downloadMarkdown() {
      if (!markdownOutput.value.trim()) convert();
      if (!markdownOutput.value.trim()) return;

      const blob = new Blob([markdownOutput.value + "\n"], { type: "text/markdown;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = window.Handpick.fileNameFromMarkdown(markdownOutput.value);
      link.click();
      URL.revokeObjectURL(url);
      statusLine.textContent = `${link.download} 파일로 저장했습니다.`;
    }

    document.querySelector("#convertButton").addEventListener("click", convert);
    document.querySelector("#copyButton").addEventListener("click", copyMarkdown);
    document.querySelector("#downloadButton").addEventListener("click", downloadMarkdown);
    document.querySelector("#clearButton").addEventListener("click", () => {
      htmlInput.value = "";
      markdownOutput.value = "";
      statusLine.textContent = "";
      htmlInput.focus();
    });
    htmlInput.addEventListener("paste", () => setTimeout(convert, 0));
  </script>
  <script>
    window.va = window.va || function () {
      (window.vaq = window.vaq || []).push(arguments);
    };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
